<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StayCu.AI</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: sans-serif; background: #f5f5f5; padding: 20px; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
    .form textarea, .form input, #userInput {
      width: 100%; padding: 10px; margin-top: 10px;
      border-radius: 5px; border: 1px solid #ccc;
    }
    .form button, #chatbox button {
      margin-top: 10px; padding: 10px 20px;
    }
    #chatbox { margin-top: 20px; }
    #messages {
      height: 300px; overflow-y: auto;
      background: #eee; padding: 10px;
      border-radius: 5px;
    }
    .message { margin-bottom: 10px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>StayCu.AI</h1>
    <div class="form">
      <input type="text" id="name" placeholder="Character Name">
      <textarea id="personality" placeholder="Describe personality... (e.g. cold but caring)"></textarea>
      <button onclick="startChat()">Start Chat</button>
    </div>

    <div id="chatbox" class="hidden">
      <div id="messages"></div>
      <input type="text" id="userInput" placeholder="Type your message...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    let characterPrompt = '';

    function startChat() {
      const name = document.getElementById('name').value.trim();
      const personality = document.getElementById('personality').value.trim();

      if (!name || !personality) {
        alert("Please fill in both character name and personality.");
        return;
      }

      characterPrompt = `You are ${name}, ${personality}`;
      document.querySelector('.form').classList.add('hidden');
      document.getElementById('chatbox').classList.remove('hidden');
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const message = input.value.trim();
      if (!message) return;

      addMessage('You', message);
      input.value = '';

      const response = await fetch('https://staycu-backend.replit.app/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: characterPrompt, message })
      });

      const data = await response.json();
      addMessage('AI', data.reply);
    }

    function addMessage(sender, text) {
      const messages = document.getElementById('messages');
      const div = document.createElement('div');
      div.classList.add('message');
      div.innerHTML = `<strong>${sender}:</strong> ${text}`;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }
  </script>
</body>
</html>
